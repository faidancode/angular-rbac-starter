<div class="shell-container">
  <app-sidebar [collapsed]="isCollapsed()" (toggleCollapse)="isCollapsed.set(!isCollapsed())" />

  <main class="shell-main">
    <header>
      <div class="header-left">
        <button (click)="isCollapsed.set(!isCollapsed())" class="menu-toggle">
          <svg lucideMenu [size]="20"></svg>
        </button>
      </div>

      <div class="header-right">
        <div class="user-profile" (click)="toggleDropdown()" role="button" data-testid="shell-profile-trigger">
          <div class="user-info">
            <span class="user-name">{{ user()?.name ?? 'Anonymous' }}</span>
            <span class="user-role">{{ user()?.roleName ?? 'Unauthorized' }}</span>
          </div>

          <div class="user-avatar">
            <span>{{ initials() }}</span>
          </div>

          @if (isDropdownOpen()) {
            <div class="profile-dropdown">
              <button class="dropdown-item">
                 <svg lucideUser [size]="20"></svg>
                 Profile
                </button>
              <button class="dropdown-item text-danger" (click)="logout()">
                 <svg lucideLogOut [size]="20"></svg>
                Logout
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <section class="content-section custom-scrollbar">
      <div class="grid-pattern"></div>
      <div class="content-wrapper">
        <router-outlet />
      </div>
    </section>
  </main>
</div>
