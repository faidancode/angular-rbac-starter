<div class="dashboard-container animate-sharp">
  <header class="dashboard-header">
    <div class="header-content">
      <h2>Insight Center</h2>
      <p>Operational Metrics & Strategic Data</p>
    </div>

  </header>

  <section class="stats-grid">
    @for (card of stats(); track card.label) {
      <div class="stat-card">
        <div class="card-header">
          <div class="icon-box">
            <svg [lucideIcon]="card.icon" [size]="20" [class]="card.color"></svg>
          </div>
          <div
            class="change-badge"
            [class.positive]="card.positive"
            [class.negative]="!card.positive"
          >
            {{ card.change }}
          </div>
        </div>
        <div class="card-body">
          <p class="card-label">{{ card.label }}</p>
          <p class="card-value">{{ card.value }}</p>
        </div>
      </div>
    }
  </section>
</div>
